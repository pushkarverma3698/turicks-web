version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install
        - nvm use
        - node -v
        - npm ci --prefer-offline --no-audit
    build:
      commands:
        - NODE_OPTIONS=--max-old-space-size=4096 npm run build
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - ~/.npm/**/*
