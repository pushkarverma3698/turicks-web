<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="url(#accentGradient)" opacity="0.1"/>
  <circle cx="1100" cy="500" r="200" fill="url(#accentGradient)" opacity="0.1"/>

  <!-- Left accent bar -->
  <rect width="6" height="630" fill="url(#accentGradient)"/>

  <!-- Main text content -->
  <text x="60" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="white" letter-spacing="-2">
    AI Agents,
  </text>
  <text x="60" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="white" letter-spacing="-2">
    SaaS & Custom
  </text>
  <text x="60" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="url(#accentGradient)" letter-spacing="-2">
    Software
  </text>

  <!-- Tagline -->
  <text x="60" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#e0e0e0">
    Built to Win — India's AI-Native Build Partner
  </text>

  <!-- Badge/CTA -->
  <rect x="60" y="480" width="280" height="60" rx="12" fill="#7c3aed" opacity="0.2" stroke="#7c3aed" stroke-width="2"/>
  <text x="80" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#7c3aed">
    turicks.com
  </text>
</svg>